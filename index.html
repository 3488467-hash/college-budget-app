<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大学生生活账本 V2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#202536;font:15px system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:760px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #18233a0b}h1{font-size:23px;margin:8px 0}h2{font-size:17px;margin:0 0 12px}.muted{color:#778096;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f6f8fc;padding:12px;border-radius:12px}.metric b{display:block;font-size:20px;margin-top:5px}input,select,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #dce1eb;width:100%;background:white}button{background:#315ee8;color:white;border:0;font-weight:600;cursor:pointer}.secondary{background:#eef2ff;color:#3154c9}.danger{background:#fff0f0;color:#c33}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.tabs{display:flex;gap:8px}.tabs button{flex:1}.tabs button.active{background:#243d9c}.hidden{display:none!important}.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5}.item:last-child{border:0}.bar{height:9px;background:#e9edf5;border-radius:20px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#5275ed}.positive{color:#169765}.negative{color:#d84a4a}label{display:block;font-size:13px;color:#667085;margin:8px 0 5px}
</style></head>
<body><main>
<header><h1>大学生生活账本</h1><div class="muted">V2 · 云端同步版</div></header>
<section id="auth" class="card">
<h2>账号登录 / 注册</h2><label>邮箱</label><input id="email" type="email" placeholder="请输入邮箱"><label>密码（至少 8 位）</label><input id="password" type="password" placeholder="请输入密码">
<div class="row" style="margin-top:12px"><button id="login">登录</button><button id="signup" class="secondary">注册账号</button></div><p id="authMsg" class="muted">注册后请留意邮箱验证邮件；验证完成后再登录。</p>
</section>
<section id="app" class="hidden">
<div class="card row"><div><b id="who"></b><div class="muted">数据已按账号隔离保存</div></div><button id="logout" class="secondary">退出登录</button></div>
<nav class="tabs"><button class="active" data-tab="ledger">记账</button><button class="secondary" data-tab="summary">收支汇总</button></nav>
<div id="ledger">
<section class="card"><div class="row"><div><label>查看月份</label><input id="month" type="month"></div><div><label>每月预算（元）</label><input id="budget" type="number" min="0" step=".01"></div></div><button id="saveBudget" class="secondary" style="margin-top:8px">保存预算</button>
<div class="grid" style="margin-top:12px"><div class="metric">本月收入<b id="income">¥0.00</b></div><div class="metric">本月支出<b id="expense">¥0.00</b></div><div class="metric">预算剩余<b id="remain">¥0.00</b></div><div class="metric">预算使用率<b id="usage">0%</b></div></div><div class="bar"><i id="budgetBar" style="width:0%"></i></div></section>
<section class="card"><h2>记一笔</h2><div class="row"><select id="type"><option value="expense">支出</option><option value="income">收入</option></select><input id="amount" type="number" min=".01" step=".01" placeholder="金额（元）"></div><div class="row"><select id="category"></select><input id="date" type="date"></div><input id="note" placeholder="备注（选填）" style="margin:9px 0"><button id="add">保存记录</button></section>
<section class="card"><h2>本月分类支出</h2><div id="categories" class="muted">暂无记录</div></section>
<section class="card"><h2>交易记录</h2><div class="row"><select id="filter"><option value="all">全部类型</option><option value="expense">仅支出</option><option value="income">仅收入</option></select><button id="backup" class="secondary">导出备份</button></div><div id="transactions"></div><button id="csv" class="secondary">导出 CSV</button><label>从 JSON 备份恢复（会追加记录，不会覆盖现有数据）</label><input id="restoreFile" type="file" accept=".json,application/json"></section>
</div>
<div id="summary" class="hidden">
<section class="card"><h2>年度收支总览</h2><label>选择年份</label><select id="year"></select><div class="grid"><div class="metric">全年收入<b id="yIncome">¥0.00</b></div><div class="metric">全年支出<b id="yExpense">¥0.00</b></div><div class="metric">年度结余<b id="yNet">¥0.00</b></div><div class="metric">记录笔数<b id="yCount">0</b></div></div></section>
<section class="card"><h2>每月收支</h2><div id="monthly"></div></section><section class="card"><h2>年度支出分类</h2><div id="yearCats"></div></section>
</div></section>
<p class="muted">提示：云端数据需要网络。建议定期导出 JSON 备份。请勿向任何人提供 Supabase Secret / service_role 密钥。</p>
</main>
<script>
const SUPABASE_URL='https://jrdrypezlpqfhjlsejpw.supabase.co';
const SUPABASE_KEY='sb_publishable_k2-1qEuXsgmKYLS8cAoFMg_u4NC8Nt5';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id), money=n=>'¥'+Number(n||0).toFixed(2);
const cats={expense:['餐饮','交通','购物','学习','娱乐','生活用品','医疗','其他'],income:['生活费','兼职收入','奖学金','红包','其他']};
let user=null,tx=[],budget=1500;
function msg(t){$('authMsg').textContent=t}
function options(){ $('category').innerHTML=cats[$('type').value].map(x=>`<option>${x}</option>`).join('') }
$('type').onchange=options;options();
$('login').onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});msg(error?error.message:'登录成功，正在加载…')};
$('signup').onclick=async()=>{let {data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:'https://3488467-hash.github.io/college-budget-app/'}});msg(error?error.message:(data.session?'注册成功':'注册请求已提交，请检查邮箱完成验证后登录。'))};
$('logout').onclick=()=>db.auth.signOut();
db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(user){$('who').textContent=user.email;init()}});
async function init(){await loadData();let now=new Date();$('month').value=now.toISOString().slice(0,7);$('date').value=now.toISOString().slice(0,10);$('year').innerHTML=Array.from({length:6},(_,i)=>`<option>${now.getFullYear()-i}</option>`).join('');render()}
async function loadData(){let [a,b]=await Promise.all([db.from('transactions').select('*').order('date',{ascending:false}).order('created_at',{ascending:false}),db.from('user_settings').select('monthly_budget').eq('user_id',user.id).maybeSingle()]);if(a.error){alert(a.error.message);return}tx=a.data||[];budget=Number(b.data?.monthly_budget??1500);$('budget').value=budget}
async function saveSettings(){let {error}=await db.from('user_settings').upsert({user_id:user.id,monthly_budget:Number($('budget').value||0),updated_at:new Date().toISOString()});if(error)alert(error.message);else{budget=Number($('budget').value||0);render()}}
$('saveBudget').onclick=saveSettings;
async function add(){let amount=Number($('amount').value);if(!(amount>0)){alert('请输入大于 0 的金额');return}let row={user_id:user.id,type:$('type').value,amount,date:$('date').value,category:$('category').value,note:$('note').value.trim()};let {data,error}=await db.from('transactions').insert(row).select().single();if(error){alert(error.message);return}tx.unshift(data);$('amount').value='';$('note').value='';render()}
$('add').onclick=add;
async function remove(id){if(!confirm('确定删除这条记录吗？'))return;let {error}=await db.from('transactions').delete().eq('id',id);if(error)alert(error.message);else{tx=tx.filter(x=>x.id!==id);render()}}
$('month').onchange=render;$('filter').onchange=render;$('year').onchange=render;
function sum(arr,type){return arr.filter(x=>x.type===type).reduce((s,x)=>s+Number(x.amount),0)}
function render(){let m=$('month').value,rows=tx.filter(x=>x.date?.startsWith(m)),inc=sum(rows,'income'),exp=sum(rows,'expense'),remain=budget-exp,pct=budget>0?exp/budget*100:0;$('income').textContent=money(inc);$('expense').textContent=money(exp);$('remain').textContent=money(remain);$('usage').textContent=pct.toFixed(1)+'%';$('budgetBar').style.width=Math.min(100,Math.max(0,pct))+'%';
let cm={};rows.filter(x=>x.type==='expense').forEach(x=>cm[x.category]=(cm[x.category]||0)+Number(x.amount));$('categories').innerHTML=Object.entries(cm).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')||'暂无记录';
let shown=rows.filter(x=>$('filter').value==='all'||x.type===$('filter').value);$('transactions').innerHTML=shown.map(x=>`<div class="item"><div><b>${esc(x.category)}</b><div class="muted">${esc(x.date)} · ${esc(x.note||'无备注')}</div></div><div style="text-align:right"><b class="${x.type==='income'?'positive':'negative'}">${x.type==='income'?'+':'−'}${money(x.amount)}</b><button class="danger" style="padding:5px 9px;margin-top:5px;width:auto" onclick="remove('${x.id}')">删除</button></div></div>`).join('')||'<p class="muted">这个月份还没有记录。</p>';renderYear()}
function renderYear(){let y=$('year').value||new Date().getFullYear(),rows=tx.filter(x=>x.date?.startsWith(String(y))),inc=sum(rows,'income'),exp=sum(rows,'expense');$('yIncome').textContent=money(inc);$('yExpense').textContent=money(exp);$('yNet').textContent=money(inc-exp);$('yCount').textContent=rows.length;
$('monthly').innerHTML=Array.from({length:12},(_,i)=>{let m=String(i+1).padStart(2,'0'),r=rows.filter(x=>x.date.slice(5,7)===m),a=sum(r,'income'),b=sum(r,'expense'),max=Math.max(a,b,1);return `<div class="item"><div style="width:100%"><b>${i+1}月</b><div class="muted">收入 ${money(a)} · 支出 ${money(b)}</div><div class="bar"><i style="width:${b/max*100}%"></i></div></div></div>`}).join('');
let c={};rows.filter(x=>x.type==='expense').forEach(x=>c[x.category]=(c[x.category]||0)+Number(x.amount));$('yearCats').innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><span>${esc(k)}</span><b>${money(v)} · ${exp?(v/exp*100).toFixed(1):0}%</b></div>`).join('')||'暂无支出'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x===b);x.classList.toggle('secondary',x!==b)});$('ledger').classList.toggle('hidden',b.dataset.tab!=='ledger');$('summary').classList.toggle('hidden',b.dataset.tab!=='summary');renderYear()});
$('backup').onclick=()=>download('college-ledger-backup.json',JSON.stringify({version:2,transactions:tx,budget},null,2),'application/json');
$('csv').onclick=()=>{let lines=[['日期','类型','金额','分类','备注'],...tx.filter(x=>x.date?.startsWith($('month').value)).map(x=>[x.date,x.type==='income'?'收入':'支出',x.amount,x.category,x.note||''])];download('college-ledger.csv','\ufeff'+lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')};
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
$('restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text()),list=obj.transactions;if(!Array.isArray(list))throw Error('备份文件格式不正确');let clean=list.map(x=>({user_id:user.id,type:x.type,amount:Number(x.amount),date:x.date,category:x.category||'其他',note:x.note||''})).filter(x=>['income','expense'].includes(x.type)&&x.amount>0&&x.date);if(!clean.length)throw Error('没有可导入的有效记录');if(!confirm(`将追加 ${clean.length} 条记录，可能产生重复项。继续吗？`))return;let {error}=await db.from('transactions').insert(clean);if(error)throw error;await loadData();render();alert('恢复完成')}catch(err){alert('导入失败：'+err.message)}e.target.value=''};
</script></body></html>
